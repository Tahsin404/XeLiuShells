<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">XeLiuShells</title>
  <desc id="d">A Quickshell desktop shell for Hyprland, drawn as the shell's own pills: a clock pill on top, two edge handles, and a workspace dock at the bottom.</desc>

  <!-- canvas -->
  <rect width="1200" height="340" rx="28" fill="#34302c"/>
  <rect x="1" y="1" width="1198" height="338" rx="27" fill="none" stroke="#4f4a44" stroke-width="2"/>

  <!-- top clock pill -->
  <rect x="505" y="18" width="190" height="40" rx="20" fill="#413D38" stroke="#dfdad2" stroke-width="2"/>
  <text x="600" y="44" text-anchor="middle" font-family="'BigBlueTermPlus Nerd Font','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="17" font-weight="700" fill="#dfdad2">XeLiuS</text>

  <!-- left media handle -->
  <rect x="14" y="125" width="40" height="90" rx="20" fill="#413D38" stroke="#dfdad2" stroke-width="2"/>
  <rect x="28" y="142" width="12" height="56" rx="5" fill="#C5BAA8"/>

  <!-- right utility handle -->
  <rect x="1146" y="125" width="40" height="90" rx="20" fill="#413D38" stroke="#dfdad2" stroke-width="2"/>
  <rect x="1160" y="142" width="12" height="56" rx="5" fill="#C5BAA8"/>

  <!-- title block -->
  <text x="600" y="168" text-anchor="middle" font-family="'BigBlueTermPlus Nerd Font','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="68" font-weight="700" fill="#dfdad2" letter-spacing="2">XeLiuShells</text>
  <text x="600" y="214" text-anchor="middle" font-family="'BigBlueTermPlus Nerd Font','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="21" fill="#C5BAA8">a wallpaper-themed desktop shell for Hyprland</text>
  <text x="600" y="246" text-anchor="middle" font-family="'BigBlueTermPlus Nerd Font','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#9c9893" letter-spacing="3">QUICKSHELL  ·  QML  ·  WAYLAND</text>

  <!-- bottom workspace dock: five nodes, second one active -->
  <rect x="508" y="292" width="16" height="16" rx="8" fill="#9c9893"/>
  <rect x="539" y="292" width="60" height="16" rx="8" fill="#dfdad2"/>
  <rect x="614" y="292" width="16" height="16" rx="8" fill="#9c9893"/>
  <rect x="645" y="292" width="16" height="16" rx="8" fill="#9c9893"/>
  <rect x="676" y="292" width="16" height="16" rx="8" fill="#9c9893"/>
</svg>
